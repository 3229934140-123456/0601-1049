[project]
name = "mny"
version = "0.1.0"
description = "A command-line personal finance and accounting tool"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
mny = "mny.cli:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
